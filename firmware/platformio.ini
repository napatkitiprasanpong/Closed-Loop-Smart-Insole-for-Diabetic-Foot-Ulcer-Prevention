; Firmware skeleton for the closed-loop insole controller board (ESP32-S3-WROOM-1-N8).
; NOT YET COMPILED OR RUN ON HARDWARE. The portable logic in lib/insole_core is unit-tested on a PC (see test/host/Makefile);
; src/main.cpp (pin and ADC glue) has never been built.
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I../esp32            ; pins.h is shared with the board design
