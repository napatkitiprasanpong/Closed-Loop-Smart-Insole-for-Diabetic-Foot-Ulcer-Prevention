<script>
const S=[...document.querySelectorAll('.slide')],bar=document.getElementById('bar');let cur=-1;
S.forEach(()=>bar.appendChild(document.createElement('i')));
function go(n){n=Math.max(0,Math.min(S.length-1,n));if(n===cur)return;if(cur>=0)S[cur].classList.remove('active');cur=n;S[n].classList.add('active');[...bar.children].forEach((d,i)=>d.classList.toggle('on',i===n))}
function next(){go(cur+1)}function prev(){go(cur-1)}
addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown',' ','PageDown','Enter'].includes(e.key)){e.preventDefault();next()}else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();prev()}else if(e.key==='f'||e.key==='F'){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(_){}}else if(e.key==='Home')go(0);else if(e.key==='End')go(S.length-1)});
let tx=null;addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>50)(dx<0?next:prev)();else next()});
addEventListener('click',e=>{if(e.pointerType==='touch')return;const x=e.clientX/innerWidth;x<.2?prev():next()});
(document.fonts&&document.fonts.ready||Promise.resolve()).then(()=>setTimeout(()=>go(0),150));
setTimeout(()=>{const h=document.getElementById('hint');h.classList.add('show');setTimeout(()=>h.classList.remove('show'),4000)},800);
</script></body></html>
