<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><linearGradient id="s5-tg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#30D5C8"/><stop offset="1" stop-color="#0A84FF"/></linearGradient><radialGradient id="s5-glow blue"><stop offset="0" stop-color="#0A84FF" stop-opacity="0.26"/><stop offset=".55" stop-color="#0A84FF" stop-opacity="0.091"/><stop offset="1" stop-color="#0A84FF" stop-opacity="0"/></radialGradient></defs><rect id="background" width="1920" height="1080" fill="#000"/><ellipse id="glow blue" cx="560" cy="700" rx="700" ry="600" fill="url(#s5-glow blue)"/><g id="title"><text x="104" y="176.4" font-family="Inter, 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="100" font-weight="800" fill="#F5F5F7" text-anchor="start" letter-spacing="-3">A loop, not an alert.</text></g><g id="loop ring"><circle cx="560" cy="640" r="300" fill="none" stroke="#30D5C8" stroke-width="5" stroke-opacity="0.7" stroke-dasharray="3 6" stroke-linecap="round"/></g><g id="node Sense"><circle cx="560.0" cy="340.0" r="52" fill="#0d1a1f" stroke="#30D5C8" stroke-width="3" stroke-opacity="1"/><text x="560.0" y="356.4" font-family="Inter, 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#F5F5F7" text-anchor="middle" letter-spacing="0">1</text></g><g id="step Sense"><text x="1090" y="284.5" font-family="'IBM Plex Mono', Menlo, monospace" font-size="20" font-weight="500" fill="#30D5C8" text-anchor="start" letter-spacing="1.5">01</text><text x="1170" y="298.2" font-family="Inter, 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="50" font-weight="600" fill="#F5F5F7" text-anchor="start" letter-spacing="-1">Sense</text><text x="1170" y="341.0" font-family="Inter, 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="28" font-weight="300" fill="#C7C7CC" text-anchor="start" letter-spacing="0">Pressure and temperature</text></g><g id="node Confirm"><circle cx="845.316954888546" cy="547.2949016875158" r="52" fill="#0d1a1f" stroke="#30D5C8" stroke-width="3" stroke-opacity="1"/><text x="845.316954888546" y="563.7" font-family="Inter, 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#F5F5F7" text-anchor="middle" letter-spacing="0">2</text></g><g id="step Confirm"><text x="1090" y="436.5" font-family="'IBM Plex Mono', Menlo, monospace" font-size="20" font-weight="500" fill="#30D5C8" text-anchor="start" letter-spacing="1.5">02</text><text x="1170" y="450.2" font-family="Inter, 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="50" font-weight="600" fill="#F5F5F7" text-anchor="start" letter-spacing="-1">Confirm</text><text x="1170" y="493.0" font-family="Inter, 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="28" font-weight="300" fill="#C7C7CC" text-anchor="start" letter-spacing="0">Sustained, not a single step</text></g><g id="node Plan"><circle cx="736.335575687742" cy="882.7050983124842" r="52" fill="#0d1a1f" stroke="#30D5C8" stroke-width="3" stroke-opacity="1"/><text x="736.335575687742" y="899.1" font-family="Inter, 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#F5F5F7" text-anchor="middle" letter-spacing="0">3</text></g><g id="step Plan"><text x="1090" y="588.5" font-family="'IBM Plex Mono', Menlo, monospace" font-size="20" font-weight="500" fill="#30D5C8" text-anchor="start" letter-spacing="1.5">03</text><text x="1170" y="602.2" font-family="Inter, 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="50" font-weight="600" fill="#F5F5F7" text-anchor="start" letter-spacing="-1">Plan</text><text x="1170" y="645.0" font-family="Inter, 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="28" font-weight="300" fill="#C7C7CC" text-anchor="start" letter-spacing="0">All four zones at once</text></g><g id="node Adjust"><circle cx="383.6644243122581" cy="882.7050983124842" r="52" fill="#0d1a1f" stroke="#30D5C8" stroke-width="3" stroke-opacity="1"/><text x="383.6644243122581" y="899.1" font-family="Inter, 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#F5F5F7" text-anchor="middle" letter-spacing="0">4</text></g><g id="step Adjust"><text x="1090" y="740.5" font-family="'IBM Plex Mono', Menlo, monospace" font-size="20" font-weight="500" fill="#30D5C8" text-anchor="start" letter-spacing="1.5">04</text><text x="1170" y="754.2" font-family="Inter, 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="50" font-weight="600" fill="#F5F5F7" text-anchor="start" letter-spacing="-1">Adjust</text><text x="1170" y="797.0" font-family="Inter, 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="28" font-weight="300" fill="#C7C7CC" text-anchor="start" letter-spacing="0">Deflate or inflate</text></g><g id="node Verify"><circle cx="274.6830451114539" cy="547.2949016875158" r="52" fill="#0d1a1f" stroke="#30D5C8" stroke-width="3" stroke-opacity="1"/><text x="274.6830451114539" y="563.7" font-family="Inter, 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#F5F5F7" text-anchor="middle" letter-spacing="0">5</text></g><g id="step Verify"><text x="1090" y="892.5" font-family="'IBM Plex Mono', Menlo, monospace" font-size="20" font-weight="500" fill="#30D5C8" text-anchor="start" letter-spacing="1.5">05</text><text x="1170" y="906.2" font-family="Inter, 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="50" font-weight="600" fill="#F5F5F7" text-anchor="start" letter-spacing="-1">Verify</text><text x="1170" y="949.0" font-family="Inter, 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="28" font-weight="300" fill="#C7C7CC" text-anchor="start" letter-spacing="0">Keep it, or reverse it</text></g><g id="center label"><text x="560" y="623.1" font-family="Inter, 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="44" font-weight="300" fill="#F5F5F7" text-anchor="middle" letter-spacing="0">Closed</text><text x="560" y="669.3" font-family="Inter, 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="44" font-weight="300" fill="#F5F5F7" text-anchor="middle" letter-spacing="0">loop</text></g></svg>