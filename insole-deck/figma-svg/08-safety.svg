<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><linearGradient id="s8-tg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#30D5C8"/><stop offset="1" stop-color="#0A84FF"/></linearGradient><radialGradient id="s8-glow blue"><stop offset="0" stop-color="#0A84FF" stop-opacity="0.22"/><stop offset=".55" stop-color="#0A84FF" stop-opacity="0.077"/><stop offset="1" stop-color="#0A84FF" stop-opacity="0"/></radialGradient></defs><rect id="background" width="1920" height="1080" fill="#000"/><ellipse id="glow blue" cx="450" cy="640" rx="640" ry="640" fill="url(#s8-glow blue)"/><g id="eyebrow"><text x="110" y="352.6" font-family="'IBM Plex Mono', Menlo, monospace" font-size="22" font-weight="500" fill="#30D5C8" text-anchor="start" letter-spacing="4">SAFETY</text></g><g id="title"><text x="104" y="476.8" font-family="Inter, 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="112" font-weight="800" fill="#F5F5F7" text-anchor="start" letter-spacing="-3.4">Safe</text><text x="104" y="588.8" font-family="Inter, 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="112" font-weight="800" fill="#F5F5F7" text-anchor="start" letter-spacing="-3.4">by default.</text></g><g id="item Hardware E-stop"><rect x="850" y="96" width="970" height="1.5" rx="0" fill="#fff" fill-opacity="0.25"/><text x="850" y="156.6" font-family="'IBM Plex Mono', Menlo, monospace" font-size="22" font-weight="500" fill="#30D5C8" text-anchor="start" letter-spacing="1.5">01</text><text x="950" y="174.0" font-family="Inter, 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="56" font-weight="600" fill="#F5F5F7" text-anchor="start" letter-spacing="-1">Hardware E-stop</text><text x="950" y="223.0" font-family="Inter, 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="28" font-weight="300" fill="#C7C7CC" text-anchor="start" letter-spacing="0">Cuts power, independent of software.</text></g><g id="item Valves closed when off"><rect x="850" y="318" width="970" height="1.5" rx="0" fill="#fff" fill-opacity="0.25"/><text x="850" y="378.6" font-family="'IBM Plex Mono', Menlo, monospace" font-size="22" font-weight="500" fill="#30D5C8" text-anchor="start" letter-spacing="1.5">02</text><text x="950" y="396.0" font-family="Inter, 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="56" font-weight="600" fill="#F5F5F7" text-anchor="start" letter-spacing="-1">Valves closed when off</text><text x="950" y="445.0" font-family="Inter, 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="28" font-weight="300" fill="#C7C7CC" text-anchor="start" letter-spacing="0">Hold pressure if power is lost; a relief valve caps it.</text></g><g id="item Watched in software"><rect x="850" y="540" width="970" height="1.5" rx="0" fill="#fff" fill-opacity="0.25"/><text x="850" y="600.5" font-family="'IBM Plex Mono', Menlo, monospace" font-size="22" font-weight="500" fill="#30D5C8" text-anchor="start" letter-spacing="1.5">03</text><text x="950" y="618.0" font-family="Inter, 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="56" font-weight="600" fill="#F5F5F7" text-anchor="start" letter-spacing="-1">Watched in software</text><text x="950" y="667.0" font-family="Inter, 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="28" font-weight="300" fill="#C7C7CC" text-anchor="start" letter-spacing="0">Watchdog, stuck sensors, leaks, time cap.</text></g><g id="item Faults fail safe"><rect x="850" y="762" width="970" height="1.5" rx="0" fill="#fff" fill-opacity="0.25"/><text x="850" y="822.5" font-family="'IBM Plex Mono', Menlo, monospace" font-size="22" font-weight="500" fill="#30D5C8" text-anchor="start" letter-spacing="1.5">04</text><text x="950" y="840.0" font-family="Inter, 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="56" font-weight="600" fill="#F5F5F7" text-anchor="start" letter-spacing="-1">Faults fail safe</text><text x="950" y="889.0" font-family="Inter, 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="28" font-weight="300" fill="#C7C7CC" text-anchor="start" letter-spacing="0">A bad or lost sensor: back to neutral.</text></g><g id="footer"><text x="110" y="998.5" font-family="'IBM Plex Mono', Menlo, monospace" font-size="18" font-weight="500" fill="#A1A1A6" text-anchor="start" letter-spacing="2">TESTED IN SIMULATION  ·  NOT YET VALIDATED ON HARDWARE</text></g></svg>