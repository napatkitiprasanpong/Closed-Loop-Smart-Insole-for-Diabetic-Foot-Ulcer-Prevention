name: CI
on:
  push:
  pull_request:
jobs:
  offload-demo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: offload-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: offload-demo/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
